version: '3.4'

services:
  api_gateway:
    build:
        context: .
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8081:8080"
    networks:
      - produktnetwork
    restart: on-failure

  account_service:
    build:
        context: ../account_service/
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8082:8080"
    depends_on:
      - sqlserv_account
    networks:
      - produktnetwork
    restart: on-failure

  payment_service:
    build:
        context: ../payment_service/
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8083:8080"
    depends_on:
      - sqlserv_payment
    networks:
      - produktnetwork
    restart: on-failure

  game_service:
    build:
        context: ../game_service/
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8084:8080"
    depends_on:
      - sqlserv_game
    networks:
      - produktnetwork
    restart: on-failure

  sqlserv_account:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
        MSSQL_SA_PASSWORD: "Pa$$word123!@#"
        ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_account:/var/opt/account_service_sqlserver
    networks:
      - produktnetwork

  sqlserv_payment:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
        MSSQL_SA_PASSWORD: "Pa$$word123!@#"
        ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_payment:/var/opt/payment_service_sqlserver
    networks:
      - produktnetwork

  sqlserv_game:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
        MSSQL_SA_PASSWORD: "Pa$$word123!@#"
        ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_game:/var/opt/game_service_sqlserver
    networks:
      - produktnetwork
networks:
  produktnetwork:    

volumes:
  sqlserver_payment:    
  sqlserver_account:    
  sqlserver_game:   