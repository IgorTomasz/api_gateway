version: '3.4'

services:
  api_gateway:
    build:
        context: .
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8082:8080"
      - "8083:8081" 
    networks:
      - produktnetwork
    restart: on-failure

  account_service:
    build:
        context: ../account_service/
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
      - "8081:8081" 
    depends_on:
      - sqlserv_account
    networks:
      - produktnetwork
    restart: on-failure

  sqlserv_account:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
        MSSQL_SA_PASSWORD: "Pa$$word123!@#"
        ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_account:/var/opt/account_service_sqlserver
    networks:
      - produktnetwork
networks:
  produktnetwork:    

volumes:
  sqlserver_payment:    
  sqlserver_account:    